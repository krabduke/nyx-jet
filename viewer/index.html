<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyx</title>
<meta name="description" content="Interactive model of Nyx, a twin-engine canard-delta agile fighter powered by two Aether AX-1 engines.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141A26'/%3E%3Cpath d='M16 3 L29 24 L20 22 L16 28 L12 22 L3 24 Z' fill='%23E4E1D8'/%3E%3Ccircle cx='5' cy='24' r='2' fill='%23D24B3F'/%3E%3Ccircle cx='27' cy='24' r='2' fill='%233E9E76'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#141A26;
    --panel:#1C2433;
    --line:#2F3B52;
    --ink:#E4E1D8;
    --muted:#8791A3;
    --port:#D24B3F;
    --stbd:#3E9E76;
    --focus:#A9C1E8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--night); color:var(--ink); overflow:hidden;
    font-family:"Chakra Petch",system-ui,sans-serif; font-size:15px;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  }
  canvas{display:block; touch-action:none}
  #stage{position:fixed; inset:0}

  #title{position:fixed; top:20px; left:24px; z-index:5; pointer-events:none; max-width:min(520px,60vw)}
  #title h1{margin:0; font-size:40px; font-weight:600; letter-spacing:.02em; line-height:1}
  #title p{margin:8px 0 0; color:var(--muted); font-size:15px; line-height:1.4}

  #figures{
    position:fixed; top:20px; right:24px; z-index:5; margin:0;
    display:grid; grid-template-columns:auto auto; column-gap:14px; row-gap:3px;
    font-size:14px; pointer-events:none; text-align:right;
  }
  #figures dt{color:var(--muted)}
  #figures dd{margin:0; font-weight:500}

  #modules{
    position:fixed; left:24px; top:50%; transform:translateY(-50%); z-index:6;
    display:flex; flex-direction:column; gap:4px; margin:0; padding:0; list-style:none;
  }
  #modules button{
    font:inherit; color:var(--ink); background:none; border:0; padding:4px 6px 4px 0;
    display:flex; align-items:center; gap:10px; cursor:pointer; text-align:left;
  }
  #modules button i{width:10px; height:10px; border-radius:2px; background:var(--sw); flex:none}
  #modules button[aria-pressed="false"]{color:var(--muted)}
  #modules button[aria-pressed="false"] i{background:none; box-shadow:inset 0 0 0 1px var(--muted)}
  #modules small{color:var(--muted); font-size:12px}

  #controls{
    position:fixed; left:24px; bottom:22px; z-index:6;
    display:flex; flex-wrap:wrap; gap:10px 22px; align-items:flex-end;
  }
  .group{display:flex; flex-direction:column; gap:6px}
  .group > span{color:var(--muted); font-size:13px}
  .seg{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; background:rgba(20,26,38,.85)}
  .seg button, .toggle{
    font:inherit; color:var(--ink); background:none; border:0; padding:6px 13px; cursor:pointer;
  }
  .seg button{border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--night)}
  .toggle{background:rgba(20,26,38,.85); border:1px solid var(--line); border-radius:3px}
  .toggle[aria-pressed="true"]{border-color:var(--ink)}
  button:focus-visible, input:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  .group > label{color:var(--muted); font-size:13px}
  #swivel, #yaw{width:160px; accent-color:var(--ink)}
  .val{min-width:3em; display:inline-block; color:var(--ink)}

  /* the one loud thing: how fast it turns */
  #turn{
    position:fixed; right:24px; bottom:20px; z-index:5; width:300px; pointer-events:none;
  }
  #turn svg{display:block; width:100%; height:auto; overflow:visible}
  #turn .arc{fill:none; stroke:var(--line); stroke-width:10}
  #turn .inst{fill:none; stroke:var(--ink); stroke-width:10}
  #turn .sust{fill:none; stroke:var(--muted); stroke-width:10}
  #turn .tick{stroke:var(--muted); stroke-width:1.2}
  #turn .lab{fill:var(--muted); font-size:11px}
  #turn .big{fill:var(--ink); font-size:44px; font-weight:600}
  #turn .unit{fill:var(--muted); font-size:13px}
  #turn p{margin:4px 0 0; color:var(--muted); font-size:13px; line-height:1.4; text-align:center}
  #turn p b{color:var(--ink); font-weight:500}

  #probe{
    position:fixed; top:50%; right:24px; transform:translateY(-50%); z-index:6;
    width:240px; padding:12px 14px; background:rgba(28,36,51,.95); border:1px solid var(--line);
    border-left:3px solid var(--probe, var(--muted)); border-radius:3px;
    opacity:0; transition:opacity .12s; pointer-events:none;
  }
  #probe.on{opacity:1}
  #probe h2{margin:0 0 4px; font-size:17px; font-weight:600}
  #probe p{margin:0; color:var(--muted); font-size:14px; line-height:1.4}

  #loading{position:fixed; inset:0; display:grid; place-items:center; z-index:20; background:var(--night); transition:opacity .5s}
  #loading.gone{opacity:0; pointer-events:none}
  #loading p{color:var(--muted); max-width:36em; text-align:center; line-height:1.5}
  #loading .bar{width:220px; height:2px; background:var(--line); margin:10px auto 0}
  #loading .bar i{display:block; height:100%; width:0; background:var(--ink)}

  @media (max-width:820px){
    #title h1{font-size:30px}
    #title p{display:none}
    #figures{display:none}
    #modules{top:auto; bottom:120px; transform:none; left:12px; font-size:13px}
    #turn{width:180px; right:12px; bottom:auto; top:16px}
    #turn p{display:none}
    #controls{left:12px; bottom:14px}
    #probe{top:auto; bottom:120px; right:12px; transform:none; width:200px}
  }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important} }
</style>
</head>
<body>
<div id="stage" aria-label="Nyx 3D model. Drag to orbit, scroll to zoom, hover a part to name it."></div>

<header id="title">
  <h1>Nyx</h1>
  <p id="tagline"></p>
</header>

<dl id="figures" aria-label="The aircraft at combat weight"></dl>

<ul id="modules" aria-label="Show or hide parts of the aircraft"></ul>

<div id="controls">
  <div class="group">
    <span id="view-l">View</span>
    <div class="seg" role="group" aria-labelledby="view-l">
      <button data-v="quarter" aria-pressed="true">Three-quarter</button>
      <button data-v="plan" aria-pressed="false">Plan</button>
      <button data-v="side" aria-pressed="false">Side</button>
      <button data-v="rear" aria-pressed="false">Rear</button>
    </div>
  </div>
  <div class="group">
    <label for="swivel">Nozzles down <span class="val" id="swval">0°</span></label>
    <input id="swivel" type="range" min="0" max="95" step="1" value="0">
  </div>
  <div class="group">
    <label for="yaw">Nozzles yaw <span class="val" id="yawval">0°</span></label>
    <input id="yaw" type="range" min="-12" max="12" step="1" value="0">
  </div>
  <div class="group">
    <span>Inside</span>
    <button class="toggle" id="xray" aria-pressed="false">See through the skin</button>
  </div>
</div>

<figure id="turn" aria-label="Turn rate at sea level">
  <svg viewBox="0 0 300 170" id="dial"></svg>
  <p id="turn-note"></p>
</figure>

<aside id="probe" aria-live="polite"><h2 id="p-name"></h2><p id="p-body"></p></aside>
<div id="loading"><div><p id="load-msg">Loading the aircraft</p><div class="bar"><i id="load-bar"></i></div></div></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* Part names this page drives. The validator checks every one resolves. */
const matching = (...n) => n;
// the outer skin the x-ray view makes see-through
const SKIN = matching('fuselage_skin', 'wing_', 'canard_', 'fin_', 'rudder_',
  'le_flap_', 'flaperon_', 'canopy_glass', 'bay_door_');

const MM = 0.001;
const $ = (id) => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const M = await (await fetch('parts.json')).json();
const F = M.figures;

/* ---------------- words ---------------- */
$('tagline').textContent = M.role.charAt(0).toUpperCase() + M.role.slice(1) +
  `, on two Aether AX-1 engines of ${F.engine_thrust_kn} kN each.`;
const figs = [
  ['Length × span', `${(F.length_mm / 1000).toFixed(1)} × ${(F.span_mm / 1000).toFixed(1)} m`],
  ['Combat mass', `${F.combat_mass_kg.toLocaleString()} kg`],
  ['Wing area', `${F.wing_area_m2} m²`],
  ['Wing loading', `${F.wing_loading} kg/m²`],
  ['Thrust / weight', F.tw],
  ['Static margin', `${F.static_margin_pct > 0 ? '+' : ''}${F.static_margin_pct} % MAC`],
  ['Load limit', `${F.g_limit} g`],
];
$('figures').innerHTML = figs.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

/* ---------------- turn-rate dial ---------------- */
(function dial(){
  const MAX = 40, cx = 150, cy = 150, r = 120;
  const pt = (v, rr = r) => {
    const a = Math.PI * (1 - v / MAX);
    return [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
  };
  const arc = (v0, v1) => {
    const [x0, y0] = pt(v0), [x1, y1] = pt(v1);
    return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  };
  let s = `<path class="arc" d="${arc(0, MAX)}"/>`;
  s += `<path class="sust" d="${arc(0, F.str_sl)}"/>`;
  s += `<path class="inst" d="${arc(F.str_sl, F.itr_sl)}"/>`;
  for (let v = 0; v <= MAX; v += 10) {
    const [a, b] = pt(v, r - 14), [c, d] = pt(v, r - 8);
    const [lx, ly] = pt(v, r - 26);
    s += `<line class="tick" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
    s += `<text class="lab" x="${lx}" y="${ly + 4}" text-anchor="middle">${v}</text>`;
  }
  s += `<text class="big" x="${cx}" y="${cy - 12}" text-anchor="middle">${F.itr_sl}</text>`;
  s += `<text class="unit" x="${cx}" y="${cy + 8}" text-anchor="middle">degrees a second</text>`;
  $('dial').innerHTML = s;
  $('turn-note').innerHTML =
    `Instantaneous turn at sea level, at ${F.g_limit} g and ${Math.round(F.corner_ms * 3.6)} km/h. ` +
    `It holds <b>${F.str_sl}°/s</b> at ${F.str_sl_g} g without losing speed.`;
})();

/* ---------------- scene ---------------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.1;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141A26);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const key = new THREE.DirectionalLight(0xfff1e0, 2.4); key.position.set(-6, 10, 8); scene.add(key);
const moon = new THREE.DirectionalLight(0xbcd0ff, 1.3); moon.position.set(8, 4, -8); scene.add(moon);
scene.add(new THREE.HemisphereLight(0xb8c2d6, 0x141a26, 0.5));

const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 3; controls.maxDistance = 80;
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------------- model ---------------- */
const meshes = new Map();            // part name -> [mesh]
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
const partOf = (o) => { while (o && !M.parts[o.name]) o = o.parent; return o ? o.name : null; };

let gltf;
try {
  gltf = await new Promise((res, rej) => loader.load('../build/nyx_web.glb', res,
    (e) => { if (e.total) $('load-bar').style.width = `${100 * e.loaded / e.total}%`; }, rej));
} catch (e) {
  $('load-msg').textContent = 'The model file build/nyx_web.glb could not be loaded. Run `make web`, then serve the repository root (for example `python3 -m http.server`) and open /viewer/.';
  throw e;
}
scene.add(gltf.scene);
gltf.scene.traverse(o => {
  if (!o.isMesh) return;
  const name = partOf(o);
  if (!name) return;
  const info = M.parts[name];
  const p = M.palette[info.mat] || {rgb: [0.6, 0.6, 0.6], metal: 0, rough: 0.6};
  const glass = name === 'canopy_glass';
  o.material = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setRGB(...p.rgb, THREE.LinearSRGBColorSpace),
    metalness: p.metal, roughness: p.rough, side: THREE.DoubleSide,
    transparent: glass, opacity: glass ? 0.45 : 1,
  });
  o.userData.part = name;
  if (!meshes.has(name)) meshes.set(name, []);
  meshes.get(name).push(o);
});

// frame the aircraft
const box = new THREE.Box3().setFromObject(gltf.scene);
const ctr = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3()).length();
controls.target.copy(ctr);
const VIEWS = {
  quarter: new THREE.Vector3(-0.62, 0.42, 0.66),
  plan: new THREE.Vector3(0.001, 1, 0),
  side: new THREE.Vector3(0, 0.05, 1),
  rear: new THREE.Vector3(1, 0.18, 0.02),
};
let flight = null;
function goTo(v, instant){
  const to = ctr.clone().add(VIEWS[v].clone().normalize().multiplyScalar(size * 1.05));
  if (instant || reduced) { camera.position.copy(to); return; }
  flight = {from: camera.position.clone(), to, t: 0};
}
goTo('quarter', true);
for (const b of document.querySelectorAll('.seg button')) b.addEventListener('click', () => {
  for (const o of document.querySelectorAll('.seg button')) o.setAttribute('aria-pressed', o === b);
  goTo(b.dataset.v);
});

/* ---------------- modules ---------------- */
const hidden = new Set();
const swatch = (m) => m.key.includes('port') ? 'var(--port)'
  : m.key.includes('starboard') ? 'var(--stbd)' : m.color;
$('modules').innerHTML = M.modules.map(m =>
  `<li><button aria-pressed="true" data-m="${m.key}" style="--sw:${swatch(m)}">` +
  `<i></i><span>${m.label} <small>${m.parts}</small></span></button></li>`).join('');
for (const b of document.querySelectorAll('#modules button')) b.addEventListener('click', () => {
  const on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on);
  if (on) hidden.delete(b.dataset.m); else hidden.add(b.dataset.m);
  for (const [name, list] of meshes) {
    const vis = !hidden.has(M.parts[name].m);
    for (const m of list) m.visible = vis;
  }
});

/* ---------------- x-ray ---------------- */
$('xray').addEventListener('click', () => {
  const on = $('xray').getAttribute('aria-pressed') !== 'true';
  $('xray').setAttribute('aria-pressed', on);
  for (const [name, list] of meshes) {
    if (!SKIN.some(s => name.startsWith(s))) continue;
    for (const m of list) {
      m.material.transparent = on || name === 'canopy_glass';
      m.material.opacity = on ? 0.14 : (name === 'canopy_glass' ? 0.45 : 1);
      m.material.depthWrite = !on;
      m.material.needsUpdate = true;
    }
  }
});

/* ---------------- inspection ---------------- */
const describe = (name) => {
  const mod = M.modules.find(m => m.key === M.parts[name].m);
  const pretty = name.replace(/^engine_([lr])_/, (_, s) => (s === 'l' ? 'port engine, ' : 'starboard engine, '))
    .replace(/_l$/, ', port').replace(/_r$/, ', starboard').replace(/_/g, ' ');
  return [pretty.charAt(0).toUpperCase() + pretty.slice(1),
          `${mod ? mod.label : ''}. Made of ${M.parts[name].mat.replace(/_/g, ' ')}, ${M.parts[name].f.toLocaleString()} faces.`,
          mod ? swatch(mod) : 'var(--muted)'];
};
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let lastHover = null, lastEmissive = null;
renderer.domElement.addEventListener('pointermove', (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(gltf.scene.children, true).find(h => h.object.visible &&
    !(h.object.material.transparent && h.object.material.opacity < 0.3));
  const name = hit ? hit.object.userData.part : null;
  if (name === lastHover) return;
  if (lastHover) for (const m of meshes.get(lastHover)) m.material.emissive.setHex(0x000000);
  lastHover = name;
  if (!name) { $('probe').classList.remove('on'); return; }
  for (const m of meshes.get(name)) m.material.emissive.setHex(0x2a3348);
  const [h, b, c] = describe(name);
  $('p-name').textContent = h; $('p-body').textContent = b;
  $('probe').style.setProperty('--probe', c);
  $('probe').classList.add('on');
});

/* ---------------- swivel nozzles ----------------
   Each engine's three swivel bearings in a row, each carrying everything
   behind it. Aircraft (x, y, z) is scene (x, z, -y), a proper rotation, so
   an angle about an aircraft axis is the same angle about its image. */
const NZ = M.nozzles;
const toScene = (v) => new THREE.Vector3(v[0], v[2], -v[1]);
const swivels = NZ.engines.map(eng => {
  const groups = [];
  let parent = gltf.scene, pc = new THREE.Vector3();
  for (const b of eng.bearings) {
    const c = toScene(b.c).multiplyScalar(MM);
    const g = new THREE.Group();
    parent.add(g); g.position.copy(c).sub(pc); g.updateMatrixWorld(true);
    g.userData.axis = toScene(b.n).normalize();
    for (const name of b.parts) for (const m of (meshes.get(name) || [])) g.attach(m);
    groups.push(g); parent = g; pc = c;
  }
  return groups;
});
const rotAbout = (k, a, v) => v.clone().applyAxisAngle(new THREE.Vector3(...k).normalize(), a);
function pose(pitch, yaw){
  const b = NZ.engines[0].bearings;
  const p = THREE.MathUtils.degToRad(pitch), y = THREE.MathUtils.degToRad(yaw);
  const t = new THREE.Vector3(Math.cos(p) * Math.cos(y), Math.sin(y), -Math.sin(p) * Math.cos(y));
  const want = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(t.x, -1, 1)));
  if (want < 1e-4) return [0, 0, 0];
  const T = NZ.fold_table;
  let i = 0; while (i < T.length - 2 && T[i + 1][1] < want) i++;
  const f = THREE.MathUtils.clamp((want - T[i][1]) / ((T[i + 1][1] - T[i][1]) || 1), 0, 1);
  const psi = THREE.MathUtils.degToRad(T[i][0] + (T[i + 1][0] - T[i][0]) * f);
  const d = rotAbout(b[1].n, psi, rotAbout(b[2].n, -psi, new THREE.Vector3(1, 0, 0)));
  let phi = Math.atan2(t.z, t.y) - Math.atan2(d.z, d.y);
  return [Math.atan2(Math.sin(phi), Math.cos(phi)), psi, -psi];
}
const sw = {pitch: 0, yaw: 0, tp: 0, ty: 0};
function applySwivel(){
  const a = pose(sw.pitch, sw.yaw);
  for (const groups of swivels) groups.forEach((g, k) => g.quaternion.setFromAxisAngle(g.userData.axis, a[k]));
}
$('swivel').addEventListener('input', (e) => { $('swval').textContent = `${e.target.value}°`; sw.tp = +e.target.value; });
$('yaw').addEventListener('input', (e) => { $('yawval').textContent = `${e.target.value}°`; sw.ty = +e.target.value; });

/* ---------------- loop ---------------- */
$('loading').classList.add('gone');
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (flight) {
    flight.t = Math.min(1, flight.t + dt / 0.9);
    const k = flight.t < 0.5 ? 2 * flight.t * flight.t : 1 - Math.pow(-2 * flight.t + 2, 2) / 2;
    camera.position.lerpVectors(flight.from, flight.to, k);
    if (flight.t >= 1) flight = null;
  }
  // the bearings turn at a hydraulic motor's pace, not a slider's
  if (sw.pitch !== sw.tp || sw.yaw !== sw.ty) {
    const step = (cur, tgt, v) => Math.abs(tgt - cur) < v * dt ? tgt : cur + Math.sign(tgt - cur) * v * dt;
    sw.pitch = reduced ? sw.tp : step(sw.pitch, sw.tp, 30);
    sw.yaw = reduced ? sw.ty : step(sw.yaw, sw.ty, 12);
    applySwivel();
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
